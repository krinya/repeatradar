# .github/workflows/publish-to-pypi.yml
name: Test and Publish Python Package

on:
  push:
    branches: [ main ] # Run tests on pushes to main
    # Run publish job only when a tag matching v*.*.* (e.g., v0.1.0) is pushed
    tags:
      - 'v*.*.*'
  pull_request:
    branches: [ main ] # Run tests on PRs targeting main

# Add permissions for GitHub Pages deployment
permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  test:
    name: Run Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    # Add environment for GitHub Pages deployment
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    # Add permissions for this job
    permissions:
      contents: read
      pages: write
      id-token: write
    strategy:
      fail-fast: false # Don't cancel all jobs if one Python version fails
      matrix:
        # Test against Python versions defined in pyproject.toml
        python-version: ["3.13"]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Poetry
        uses: snok/install-poetry@v1
        with:
          virtualenvs-create: true
          installer-parallel: true

      - name: Install dependencies
        run: poetry install --no-interaction --with dev

      - name: Build Sphinx documentation
        run: |
          poetry run sphinx-build -b html docs/source docs/_build/html

      - name: Setup Pages
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/configure-pages@v4

      - name: Upload Pages artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/_build/html

      - name: Deploy to GitHub Pages
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Run tests with pytest
        run: poetry run pytest tests/


  publish:
    name: Build and Publish to PyPI
    # Only run this job if:
    # 1. The trigger was a tag push matching v*.*.*
    # 2. Tests passed (needs: test)
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/repeatradar

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install Poetry
        uses: snok/install-poetry@v1

      - name: Build package
        run: poetry build

      - name: Publish package to PyPI using API Token
        # Using traditional API token authentication instead of OIDC
        # This requires a PyPI API token to be stored in GitHub secrets
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
            password: ${{ secrets.PYPI_API_TOKEN }}
            packages-dir: dist/